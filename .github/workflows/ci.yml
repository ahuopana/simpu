name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: ui/test-results

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb
      - name: Build UI (embedded into the app)
        run: npm ci && npm run build
        working-directory: ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Smoke test - app starts under Xvfb and stays up
        run: |
          cargo build -p simpu-app
          set +e
          xvfb-run -a timeout 10 ./target/debug/simpu-app > app.log 2>&1
          code=$?
          if [ "$code" != 124 ]; then
            # Job logs are not always readable from outside; surface the tail as an annotation.
            echo "::error title=app exited early ($code)::$(tail -n 15 app.log | tr '\n' '|')"
            exit 1
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI (embedded into the app)
        run: npm ci && npm run build
        working-directory: ui
      - run: cargo test --workspace
      - name: Smoke test - app starts with WebView2 and stays up
        shell: pwsh
        run: |
          cargo build -p simpu-app
          $p = Start-Process -FilePath target\debug\simpu-app.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "app exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

  windows-installer:
    if: github.ref == 'refs/heads/main'
    needs: [ui, linux, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Build NSIS installer
        run: ../../ui/node_modules/.bin/tauri build
        working-directory: crates/simpu-app
      - uses: actions/upload-artifact@v4
        with:
          name: simpu-windows-installer
          path: target/release/bundle/nsis/*.exe
