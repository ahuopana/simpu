<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Simpu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c6b7d"/><stop offset="1" stop-color="#0d3c52"/></linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f93b8"/><stop offset="1" stop-color="#3c5f84"/></linearGradient>
    <linearGradient id="low" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#35506d"/><stop offset="1" stop-color="#1e3349"/></linearGradient>
    <linearGradient id="nacre" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b3a0da"/><stop offset="1" stop-color="#7d6ab3"/></linearGradient>
    <radialGradient id="pearl" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#efe6fb"/><stop offset="1" stop-color="#b8a2dc"/></radialGradient>
    <filter id="ps" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#2c1f55" flood-opacity=".55"/></filter>
    <filter id="soft" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <ellipse cx="130" cy="228" rx="92" ry="12" fill="#041a24" opacity=".45" filter="url(#soft)"/>
  <!-- nacre interior between the valves -->
  <path d="M40 142 L214 120 C230 119 238 130 234 148 L40 184 Z" fill="url(#nacre)"/>
  <!-- upper valve (lifted) -->
  <path d="M26 130 C26 76 84 36 150 36 C197 36 231 64 234 98 C235 112 226 122 212 124 L40 144 C31 144 26 138 26 130 Z" fill="url(#shell)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="3" stroke-linecap="round">
    <path d="M48 128 C52 86 96 58 150 56 C186 56 214 76 220 100"/>
    <path d="M66 134 C70 102 104 78 150 76 C178 76 200 90 206 106"/>
    <path d="M86 138 C90 116 114 98 150 96 C168 96 184 104 190 114"/>
  </g>
  <path d="M26 130 C26 76 84 36 150 36 C197 36 231 64 234 98" fill="none" stroke="#d6f3fa" stroke-width="3" stroke-linecap="round"/>
  <!-- pearl: round top, in front of the upper valve's lip; its lower part rests behind the lower valve -->
  <circle cx="150" cy="144" r="29" fill="url(#pearl)" filter="url(#ps)"/>
  <ellipse cx="139" cy="132" rx="8" ry="5" fill="#fff" opacity=".8" transform="rotate(-30 139 132)"/>
  <path d="M141 135 l11 9 -11 9" fill="none" stroke="#43366b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M157 156 h13" fill="none" stroke="#43366b" stroke-width="4.5" stroke-linecap="round"/>
  <!-- lower valve (in front, hides the bottom of the pearl) -->
  <path d="M38 178 L214 150 C228 148 236 156 232 170 C224 204 180 218 130 218 C80 218 44 204 38 184 Z" fill="url(#low)"/>
</svg>
